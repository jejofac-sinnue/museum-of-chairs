<!-- 도구: ChatGPT / 출처: 교재 Modularity, Pattern 장 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의자 박물관 · Museum of Chairs</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
/* --------------------------------------------------
   1. Design Tokens (:root에 색, 글자 크기, 간격, 모서리 값 정의)
-------------------------------------------------- */
:root {
  /* Dynamic Responsive Grid System */
  --cols: 12;
  --gutter: 24px;
  --margin: 16px;
  --max-width: 1200px;
  
  /* Color Tokens */
  --color-bg: #ece6d8;
  --color-ink: #1d1a16;
  --color-mut: rgba(29, 26, 22, 0.6);
  --color-surface-bg: rgba(255, 255, 255, 0.08);
  --color-border: rgba(29, 26, 22, 0.2);
  --color-accent: rgba(255, 0, 128, 0.12);

  /* Typography Tokens */
  --font-serif: 'Noto Serif KR', serif;
  --font-sans: 'Noto Sans KR', system-ui, sans-serif;
  --font-display: 'Cormorant Garamond', serif;

  --text-xs: 11px;
  --text-sm: 12.5px;
  --text-base: 14.5px;
  --text-lg: 18px;
  --text-xl: 36px;

  /* Spacing Tokens */
  --space-2xs: 4px;
  --space-xs: 8px;
  --space-sm: 12px;
  --space-md: 16px;
  --space-lg: 24px;

  /* Border Radius Tokens */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 20px;
  --radius-full: 50%;

  /* Dynamic Stage Sizing */
  --S: min(36vh, 28vw, 320px);
  --cy: 34%;

  /* Time-of-day Shadow Tokens
     기본값은 원래 그림자와 같고, 스크립트가 시각에 따라 덮어씀 */
  --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.05);
  --shadow-card-featured: 0 8px 30px rgba(0, 0, 0, 0.1);
  --sh-tx: 0px;
  --sh-sx: 1;
  --sh-op: 0.13;

  box-sizing: border-box;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: #16130f;
    --color-ink: #e9e1cf;
    --color-mut: rgba(233, 225, 207, 0.6);
    --color-surface-bg: rgba(0, 0, 0, 0.25);
    --color-border: rgba(233, 225, 207, 0.2);
  }
}

:root[data-theme="dark"] {
  --color-bg: #16130f;
  --color-ink: #e9e1cf;
  --color-mut: rgba(233, 225, 207, 0.6);
  --color-surface-bg: rgba(0, 0, 0, 0.25);
  --color-border: rgba(233, 225, 207, 0.2);
}

/* --------------------------------------------------
   Breakpoints (1440px / 820px / 390px 대응)
-------------------------------------------------- */
@media (max-width: 1023px) { /* Tablet / ~820px */
  :root {
    --cols: 8;
    --gutter: 24px;
    --S: min(34vh, 38vw, 280px);
    --cy: 30%;
    --text-xl: 32px;
  }
}
@media (max-width: 639px) { /* Mobile / ~390px */
  :root {
    --cols: 4;
    --gutter: 16px;
    --S: min(26vh, 46vw, 200px);
    --cy: 22%;
    --text-xl: 28px;
  }
}

*, *::before, *::after {
  box-sizing: inherit;
}

html, body {
  min-height: 100%;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-sans);
}

body {
  min-height: 100vh;
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  gap: var(--gutter);
  padding: 0 var(--margin);
  max-width: var(--max-width);
  margin: 0 auto;
}

#st {
  position: fixed;
  inset: 0;
  touch-action: none;
  cursor: grab;
}
#st:active {
  cursor: grabbing;
}

.layer {
  position: absolute;
  left: 50%;
  top: var(--cy);
  width: var(--S);
  height: var(--S);
  margin: calc(var(--S) * -.725) 0 0 calc(var(--S) * -.5);
  transform-origin: 50% 72.5%;
  will-change: transform, opacity;
  color: var(--color-ink);
  pointer-events: none;
}
.layer svg {
  display: block;
  width: 100%;
  height: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  overflow: visible;
}

header {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0; right: 0;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 22px var(--margin);
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gutter);
  pointer-events: none;
  z-index: 10;
}
header .title-wrap { grid-column: span 8; }
header b { display: block; font: 700 20px var(--font-serif); }
header i { font: italic 400 14px var(--font-display); color: var(--color-mut); }
header #snd { grid-column: span 3; justify-self: end; }

button {
  font: 600 var(--text-xs) var(--font-sans);
  color: var(--color-ink);
  background: none;
  border: 1px solid var(--color-mut);
  border-radius: var(--radius-lg);
  padding: 6px 14px;
  cursor: pointer;
  pointer-events: auto;
  transition: background 0.2s, color 0.2s;
}
button:hover {
  background: var(--color-ink);
  color: var(--color-bg);
}

#rail {
  position: fixed;
  right: var(--margin);
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
  z-index: 10;
}
#rail button {
  border: 0;
  padding: 2px 4px;
  display: flex;
  gap: 10px;
  align-items: center;
  font: 500 13px var(--font-display);
  color: var(--color-mut);
}
#rail button:hover {
  background: transparent;
  color: var(--color-ink);
}
#rail button:after {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: var(--radius-full);
  border: 1px solid var(--color-ink);
}
#rail button.on { color: var(--color-ink); font-weight: 700; }
#rail button.on:after { background: var(--color-ink); }

#pn-container {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--margin);
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gutter);
  pointer-events: none;
  z-index: 10;
}

/* --------------------------------------------------
   2. Modules & Components & Pattern 적용 (P1 + P3 + 카드 변형)
-------------------------------------------------- */
/* 기본 모듈: 카드 컴포넌트 */
.card-module {
  grid-column: span 8;
  width: 100%;
  min-width: 0;
  max-height: min(42vh, 360px);
  overflow: auto;
  overscroll-behavior: contain;
  transition: opacity 0.35s, transform 0.35s;
  pointer-events: auto;
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gutter);
  background: var(--color-surface-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: var(--space-md);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-card);
}

.card-module.o { opacity: 0; transform: translateY(10px); }

/* 큰 카드 변형 모듈 (Modifier: --featured) */
.card-module--featured {
  background: var(--color-surface-bg);
  border-left: 4px solid var(--color-ink);
  padding: var(--space-lg);
  box-shadow: var(--shadow-card-featured);
}

.card-module > * { min-width: 0; overflow-wrap: anywhere; }
.card-module .k { grid-column: span 6; font: 600 var(--text-xs) var(--font-sans); letter-spacing: 0.2em; color: var(--color-mut); text-transform: uppercase; }
.card-module .y { grid-column: span 3; font: 500 clamp(36px, 5vw, 68px)/1 var(--font-display); margin: 4px 0 8px; letter-spacing: -0.02em; }
.card-module h2 { grid-column: span 8; font: 700 clamp(18px, 2vw, 24px)/1.25 var(--font-serif); margin: 0; }
.card-module .en { grid-column: span 6; font: italic 400 15px var(--font-display); color: var(--color-mut); margin: 2px 0 10px; }
.card-module .l { grid-column: span 6; font: 500 var(--text-base)/1.5 var(--font-serif); margin: 0 0 6px; }
.card-module .b { grid-column: span 6; font: 400 var(--text-sm)/1.7 var(--font-sans); color: var(--color-mut); margin: 0 0 10px; }
.card-module .m { grid-column: span 6; display: flex; flex-wrap: wrap; gap: 4px 14px; border-top: 1px solid var(--color-border); padding-top: var(--space-xs); font: 600 var(--text-xs) var(--font-sans); letter-spacing: 0.04em; }

/* --------------------------------------------------
   3. Pattern P1 / P3 (SVG 배지 패턴 & 서식 강조 패턴)
-------------------------------------------------- */
.pattern-badge {
  display: inline-block;
  padding: 2px 8px;
  background: var(--color-ink);
  color: var(--color-bg);
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  margin-left: 8px;
  vertical-align: middle;
}

#hint {
  position: fixed;
  left: 50%;
  bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  font: 400 var(--text-xs) var(--font-sans);
  color: var(--color-mut);
  white-space: nowrap;
  transition: opacity 0.6s;
  pointer-events: none;
  z-index: 10;
}


/* --------------------------------------------------
   Backlight (역광): 림 라이트 / 글자 후광 / 빛 번짐 / 실루엣 / 빛줄기
   값은 스크립트가 시각에 따라 덮어씀
-------------------------------------------------- */
:root {
  --sil: 0;
  --rim-solid: 255, 255, 255;
  --halo: none;
  --rim-x: 0px; --rim-y: -0.5px; --rim-c: rgba(255,255,255,.1);
  --rim-glow: 4px; --rim-glow-c: rgba(255,255,255,.15);
  --melt: 0px;
}
/* 림 라이트 + 윤곽 번짐: 의자 실루엣 가장자리에 빛 */
.layer > svg:not(.cast) {
  filter: drop-shadow(var(--rim-x) var(--rim-y) 0 var(--rim-c))
          drop-shadow(0 0 var(--rim-glow) var(--rim-glow-c))
          blur(var(--melt));
}
/* 글자 후광 */
header b, header i, .card-module .y, .card-module h2 { text-shadow: var(--halo); }
/* 실루엣 모드: 극단적 역광에서 카드는 어두운 면, 가장자리만 빛남 */
.card-module {
  background: color-mix(in srgb, rgba(10, 8, 16, .88) calc(var(--sil) * 100%), var(--color-surface-bg));
  color: color-mix(in srgb, rgb(var(--rim-solid)) calc(var(--sil) * 100%), var(--color-ink));
}
.card-module .k, .card-module .en, .card-module .b {
  color: color-mix(in srgb, rgb(var(--rim-solid)) calc(var(--sil) * 75%), var(--color-mut));
}
/* 빛 번짐(블룸) · 빛줄기 오버레이 */
#bloom, #shaft { position: fixed; inset: 0; pointer-events: none; }
#bloom { z-index: 0; }
#shaft { z-index: 5; }

svg .f { fill: currentColor; fill-rule: evenodd; }
svg .g { fill: currentColor; opacity: .4; }
/* 의자 실루엣 투영 그림자 (역광: 바닥에 길게 눕는 그림자) */
.layer svg.cast {
  position: absolute;
  inset: 0;
  overflow: visible;
  opacity: 0;
  transform-origin: 50% 94%;
  transform: skewX(var(--cast-skew, 0deg)) scaleY(var(--cast-sy, -0.3));
  filter: brightness(0) blur(var(--cast-blur, 2px));
  -webkit-mask-image: linear-gradient(to top, #000 6%, transparent 100%);
  mask-image: linear-gradient(to top, #000 6%, transparent 100%);
}
svg .gl { fill: currentColor; opacity: .12; }
svg .sh { display: none; } /* 기존 바닥 그림자 제거 */
svg .b { fill: none; stroke: var(--color-bg); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
svg .s { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }

#grid-overlay {
  position: fixed;
  inset: 0;
  margin: 0 auto;
  max-width: var(--max-width);
  padding: 0 var(--margin);
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gutter);
  pointer-events: none;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.2s ease;
}
#grid-overlay.active { opacity: 1; }
#grid-overlay div {
  background: var(--color-accent);
  border-left: 1px solid rgba(255, 0, 128, 0.2);
  border-right: 1px solid rgba(255, 0, 128, 0.2);
  height: 100%;
}
#grid-btn {
  position: fixed;
  right: var(--margin);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 1000;
  background: var(--color-bg);
}

/* --------------------------------------------------
   Responsive layout: 1440 / 820 / 390
   좁은 화면에서는 무대와 정보 카드를 세로로 분리해 겹침 방지
-------------------------------------------------- */
@media (max-width: 1023px) {
  :root {
    --S: min(32vh, 34vw, 270px);
    --cy: 34%;
    --text-xl: 32px;
  }

  header .title-wrap { grid-column: span 8; }
  header #snd { grid-column: span 4; justify-self: end; }
  .card-module {
    grid-column: span 8;
    max-height: min(43vh, 340px);
  }
  .card-module .k { grid-column: span 6; }
  .card-module .y { grid-column: span 4; }
  .card-module h2 { grid-column: span 8; }
  .card-module .en,
  .card-module .l,
  .card-module .b,
  .card-module .m { grid-column: span 6; }
}

@media (max-width: 767px) {
  :root {
    --cols: 4;
    --gutter: 14px;
    --margin: 16px;
    --S: min(28svh, 62vw, 230px);
    --cy: 50%;
    --text-xl: clamp(25px, 7vw, 30px);
  }

  html, body {
    height: auto;
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }

  body {
    display: flex;
    flex-direction: column;
    gap: 0;
    min-height: 100svh;
    padding: 0 var(--margin);
  }

  header {
    position: relative;
    inset: auto;
    order: 1;
    width: 100%;
    padding: 14px 0 4px;
    display: block;
    flex: 0 0 auto;
  }
  header .title-wrap { width: 100%; }
  header b { font-size: 19px; }
  header i { font-size: 13px; }
  header #snd { display: none; }

  #st {
    position: relative;
    inset: auto;
    order: 2;
    width: 100%;
    height: clamp(230px, 34svh, 330px);
    min-height: 230px;
    flex: 0 0 auto;
    overflow: visible;
    touch-action: none;
  }

  .layer {
    top: 50%;
    margin: calc(var(--S) * -.5) 0 0 calc(var(--S) * -.5);
    transform-origin: 50% 50%;
  }

  #pn-container {
    position: relative;
    inset: auto;
    order: 3;
    display: block;
    width: 100%;
    max-width: none;
    margin: 0;
    padding: 0 0 12px;
    flex: 0 0 auto;
  }

  .card-module,
  .card-module--featured {
    display: flex;
    flex-direction: column;
    gap: 9px;
    width: 100%;
    max-height: none;
    overflow: visible;
    padding: 16px;
    border-radius: var(--radius-md);
  }

  .card-module--featured {
    padding: 18px 16px;
  }

  .card-module .y {
    order: 1;
    font-size: clamp(32px, 9vw, 40px);
    line-height: 1;
    margin: 0 0 2px;
  }
  .card-module .k {
    order: 2;
    font-size: var(--text-xs);
    letter-spacing: .12em;
    line-height: 1.6;
  }
  .card-module h2 {
    order: 3;
    font-size: clamp(18px, 5vw, 22px);
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .card-module .en {
    order: 4;
    font-size: 14px;
    margin: 0 0 2px;
    overflow-wrap: anywhere;
  }
  .card-module .l {
    order: 5;
    font-size: var(--text-base);
    line-height: 1.55;
    margin: 0;
  }
  .card-module .b {
    order: 6;
    font-size: 12px;
    line-height: 1.7;
    margin: 0;
  }
  .card-module .m {
    order: 7;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    width: 100%;
    padding-top: 10px;
    margin-top: 2px;
    font-size: var(--text-xs);
  }
  .pattern-badge {
    margin: 3px 0 0 4px;
    white-space: nowrap;
  }

  #rail {
    position: relative;
    inset: auto;
    order: 4;
    transform: none;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
    margin: 8px 0 18px;
    padding: 0;
  }
  #rail button {
    padding: 5px;
    min-width: 18px;
    justify-content: center;
  }
  #rail button span { display: none; }

  #hint {
    position: relative;
    left: auto;
    bottom: auto;
    order: 5;
    transform: none;
    width: 100%;
    max-width: 340px;
    margin: 0 auto 72px;
    padding: 0 8px;
    white-space: normal;
    text-align: center;
    line-height: 1.6;
  }

  #grid-overlay {
    padding: 0 var(--margin);
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  }
  #grid-btn {
    right: var(--margin);
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  }
}

/* 아주 좁은 화면에서도 카드와 제목이 잘리지 않도록 보정 */
@media (max-width: 360px) {
  :root {
    --margin: 12px;
    --gutter: 10px;
    --S: min(27svh, 66vw, 210px);
  }
  .card-module,
  .card-module--featured { padding: 14px 12px; }
  .card-module .k { letter-spacing: .08em; }
  #rail { gap: 5px; }
}

</style>
</head>
<body>

<div id="grid-overlay">
  <div></div><div></div><div></div><div></div>
  <div></div><div></div><div></div><div></div>
  <div></div><div></div><div></div><div></div>
</div>
<button id="grid-btn">가이드</button>

<div id="st"></div>

<header>
  <div class="title-wrap">
    <b>의자 박물관</b>
    <i>Museum of Chairs</i>
  </div>
  <button id="snd">소리 켜짐</button>
</header>

<nav id="rail"></nav>

<div id="pn-container">
  <section id="pn" class="card-module"></section>
</div>

<div id="hint">스크롤·위아래 드래그: 의자 다리 사이로 들어가기 &nbsp;/&nbsp; 좌우로 밀기: 의자 끌기</div>

<script>
const M=p=>`<path d="${p}"/><path d="${p}" transform="translate(400 0) scale(-1 1)"/>`;

const SH='<ellipse class="sh" cx="200" cy="376" rx="150" ry="8"/>';
const Fd=d=>`<path class="f" d="${d}"/>`,Gd=d=>`<path class="g" d="${d}"/>`,Bd=d=>`<path class="b" d="${d}"/>`,Sd=(w,d)=>`<path class="s" stroke-width="${w}" d="${d}"/>`;
const F=p=>`<g class="f">${M(p)}</g>`,B=p=>`<g class="b">${M(p)}</g>`,S=(w,p)=>`<g class="s" stroke-width="${w}">${M(p)}</g>`;

const N = D.length, R = 5;
const st = document.getElementById('st');
const pn = document.getElementById('pn');
const rail = document.getElementById('rail');

const L = C.map(s => {
  const d = document.createElement('div');
  d.className = 'layer';
  d.innerHTML = `<svg class="cast" viewBox="0 0 400 400" aria-hidden="true" fill="currentColor">${s.replace(SH, '')}</svg><svg viewBox="0 0 400 400" aria-hidden="true" fill="currentColor">${s}</svg>`;
  st.appendChild(d);
  return d;
});

D.forEach((d, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<span>${d.y}</span>`;
  b.setAttribute('aria-label', d.n);
  b.onclick = () => { z = i; hideHint(); };
  rail.appendChild(b);
});

let z = 0, zd = 0, dx = 0, busy = 0, cur = -1, tm, mute = 0, ac;
const cl = v => Math.max(0, Math.min(N - 1, v));
const ez = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

function hideHint() {
  const hint = document.getElementById('hint');
  if (hint) hint.style.opacity = 0;
}

function info(i) {
  const d = D[i];
  pn.classList.add('o');
  setTimeout(() => {
    // 2. 카드 모듈 변형 클래스 적용 (Featured Modifier)
    if (d.featured) {
      pn.className = 'card-module card-module--featured';
    } else {
      pn.className = 'card-module';
    }

    // 3. 패턴(P1, P3) 및 카드 템플릿 구성
    pn.innerHTML = `
      <div class="k">${d.e} ${d.featured ? '<span class="pattern-badge">주요 작품</span>' : ''}</div>
      <div class="y">${d.y}</div>
      <h2>${d.n}</h2>
      <div class="en">${d.en}</div>
      <p class="l">${d.l}</p>
      <p class="b">${d.b}</p>
      <div class="m">${d.m.map(x => `<span>${x}</span>`).join('')}</div>
    `;
    pn.classList.remove('o');
  }, 260);

  [...rail.children].forEach((b, k) => b.classList.toggle('on', k === i));
}

const PAL = [[255, 230, 0, 26, 31, 181], [229, 0, 125, 255, 230, 0], [26, 31, 181, 255, 62, 165]];
function col(z) {
  const i = Math.floor(z), t = z - i, u = t * t * (3 - 2 * t);
  const a = PAL[i % 3], b = PAL[(i + 1) % 3];
  const m = k => Math.round(a[k] + (b[k] - a[k]) * u);
  const r = document.documentElement.style;
  const ink = `${m(3)},${m(4)},${m(5)}`;
  r.setProperty('--color-bg', `rgb(${m(0)},${m(1)},${m(2)})`);
  r.setProperty('--color-ink', `rgb(${ink})`);
  r.setProperty('--color-mut', `rgba(${ink},.72)`);
}

function draw() {
  if (!busy) zd += (z - zd) * .14;
  L.forEach((el, i) => {
    const d = zd - i;
    const s = Math.pow(R, d);
    let o = 1;
    if (d < -2.4) o = 0;
    else if (d < -1.9) o = (d + 2.4) / .5;
    else if (d > 1) o = d > 1.7 ? 0 : 1 - (d - 1) / .7;

    el.style.opacity = o;
    el.style.visibility = o ? 'visible' : 'hidden';
    el.style.transform = `scale(${s})`;
  });

  st.style.transform = `translateX(${dx}px)`;
  col(zd);

  const i = Math.round(zd);
  if (i !== cur) {
    cur = i;
    info(i);
  }
  requestAnimationFrame(draw);
}

function snd() {
  if (mute) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();

    const t = ac.currentTime;
    const dur = 0.65;
    const sampleRate = ac.sampleRate;
    const bufferSize = sampleRate * dur;
    const buffer = ac.createBuffer(1, bufferSize, sampleRate);
    const data = buffer.getChannelData(0);

    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
      data[i] *= 0.11;
      b6 = white * 0.115926;
    }

    const noise = ac.createBufferSource();
    noise.buffer = buffer;

    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(320, t);
    filter.frequency.linearRampToValueAtTime(780, t + 0.2);
    filter.frequency.linearRampToValueAtTime(380, t + dur);
    filter.Q.setValueAtTime(4.2, t);

    const lfo = ac.createOscillator();
    lfo.type = 'sawtooth';
    lfo.frequency.setValueAtTime(26, t);
    lfo.frequency.linearRampToValueAtTime(14, t + dur);

    const lfoGain = ac.createGain();
    lfoGain.gain.setValueAtTime(0.45, t);

    const mainGain = ac.createGain();
    mainGain.gain.setValueAtTime(0.01, t);
    mainGain.gain.linearRampToValueAtTime(0.7, t + 0.08);
    mainGain.gain.exponentialRampToValueAtTime(0.001, t + dur);

    noise.connect(filter);
    filter.connect(mainGain);
    lfo.connect(lfoGain);
    lfoGain.connect(mainGain.gain);
    mainGain.connect(ac.destination);

    noise.start(t);
    lfo.start(t);
    noise.stop(t + dur);
    lfo.stop(t + dur);

    const thud = ac.createOscillator();
    const thudGain = ac.createGain();
    thud.type = 'triangle';
    thud.frequency.setValueAtTime(110, t + dur - 0.08);
    thud.frequency.exponentialRampToValueAtTime(35, t + dur + 0.12);

    thudGain.gain.setValueAtTime(0, t + dur - 0.08);
    thudGain.gain.linearRampToValueAtTime(0.45, t + dur - 0.02);
    thudGain.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.15);

    thud.connect(thudGain);
    thudGain.connect(ac.destination);
    thud.start(t + dur - 0.08);
    thud.stop(t + dur + 0.15);
  } catch (e) {}
}

function slide(dir) {
  hideHint();
  const i = Math.round(z) + dir;
  if (busy || i < 0 || i >= N) return;
  busy = 1;
  snd();
  const W = innerWidth, t0 = performance.now();
  let sw = 0;
  (function f(now) {
    const p = Math.min(1, (now - t0) / 900);
    if (p < .5) dx = -dir * ez(p * 2) * W;
    else {
      if (!sw) { z = zd = i; sw = 1; }
      dx = dir * (1 - ez((p - .5) * 2)) * W;
    }
    if (p < 1) requestAnimationFrame(f);
    else { dx = 0; busy = 0; }
  })(t0);
}

function snap() {
  clearTimeout(tm);
  tm = setTimeout(() => { z = Math.round(z); }, 240);
}

addEventListener('wheel', e => {
  e.preventDefault();
  hideHint();
  if (busy) return;
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    if (Math.abs(e.deltaX) > 30) slide(e.deltaX > 0 ? 1 : -1);
    return;
  }
  z = cl(z + e.deltaY * .0014);
  snap();
}, { passive: false });

let p0 = null, z0 = 0, ax = '';
st.addEventListener('pointerdown', e => {
  p0 = [e.clientX, e.clientY];
  z0 = z;
  ax = '';
  st.setPointerCapture(e.pointerId);
});
st.addEventListener('pointermove', e => {
  if (!p0 || busy) return;
  const x = e.clientX - p0[0], y = e.clientY - p0[1];
  if (!ax && Math.hypot(x, y) > 10) ax = Math.abs(x) > Math.abs(y) ? 'h' : 'v';
  if (ax === 'v') {
    hideHint();
    z = cl(z0 - y / (innerHeight * .45));
  }
});
st.addEventListener('pointerup', e => {
  if (!p0) return;
  const x = e.clientX - p0[0];
  if (ax === 'h' && Math.abs(x) > 50) slide(x < 0 ? 1 : -1);
  else if (ax === 'v') snap();
  p0 = null;
});

addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowRight') slide(1);
  else if (k === 'ArrowLeft') slide(-1);
  else if (k === 'ArrowDown' || k === '+') { hideHint(); z = cl(Math.round(z) + 1); }
  else if (k === 'ArrowUp' || k === '-') { hideHint(); z = cl(Math.round(z) - 1); }
});

document.getElementById('snd').onclick = function() {
  mute = !mute;
  this.textContent = mute ? '소리 꺼짐' : '소리 켜짐';
};

const gridOverlay = document.getElementById('grid-overlay');
const gridBtn = document.getElementById('grid-btn');
gridBtn.onclick = function() {
  gridOverlay.classList.toggle('active');
};

/* --------------------------------------------------
   시간대별 역광 (Time-of-day Backlight)
   기기 시각 → 태양(밤엔 달) 위치 → 역광 세기·빛 색·방향
   테스트: 주소 끝에 #h=17.5 처럼 붙이면 그 시각으로 고정
-------------------------------------------------- */
(() => {
  document.body.insertAdjacentHTML('afterbegin', '<div id="bloom"></div>');
  document.body.insertAdjacentHTML('beforeend', '<div id="shaft"></div>');
  const bloom = document.getElementById('bloom');
  const shaft = document.getElementById('shaft');
  const root = document.documentElement.style;
  const lerp = (a, b, t) => a + (b - a) * t;
  const sm = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // 시각별 빛 색: 새벽 분홍금빛 → 낮 흰빛 → 해질녘 주황 → 노을 보라 → 밤 달빛
  const LIGHT = [
    [0, 120, 150, 255], [5, 140, 170, 255], [6, 255, 190, 140], [7.5, 255, 222, 170],
    [10, 255, 246, 228], [13, 255, 255, 255], [16, 255, 226, 160], [17.5, 255, 170, 90],
    [18.5, 255, 120, 90], [19.5, 200, 110, 200], [21, 120, 150, 255], [24, 120, 150, 255]
  ];
  function light(h) {
    for (let i = 0; i < LIGHT.length - 1; i++) {
      const a = LIGHT[i], b = LIGHT[i + 1];
      if (h >= a[0] && h <= b[0]) {
        const t = (h - a[0]) / (b[0] - a[0]);
        return [1, 2, 3].map(k => Math.round(lerp(a[k], b[k], t))).join(',');
      }
    }
    return '255,255,255';
  }

  function hourNow() {
    const m = location.hash.match(/[#&]h=(\d+(?:\.\d+)?)/);
    if (m) return Math.min(24, +m[1]);
    const d = new Date();
    return d.getHours() + d.getMinutes() / 60;
  }

  let castOp = 0.4;

  function applyLight() {
    const h = hourNow();
    const t = (h - 6) / 12;
    const k = Math.max(0, Math.sin(Math.PI * t));        // 태양 고도 (정오 1)
    const w = sm(0, 0.3, k);                             // 낮 비중
    const wb = sm(0, 0.06, k);                           // 해가 떠 있는지
    const X = lerp(0.6, -Math.cos(Math.PI * t), w);      // 그림자 방향
    const sun = -X;                                      // 빛이 오는 쪽 (+ 오른쪽)
    const len = lerp(2.4, Math.min(4.5, 1 / Math.max(k, 0.22)), w);
    const back = lerp(0.3, Math.pow(1 - k, 1.6), wb);    // 역광 세기: 정오 0, 일출·일몰 1
    const sil = sm(0.62, 0.95, back) * wb;               // 실루엣 모드
    const beam = sm(0.45, 0.9, back) * sm(0, 0.08, k);   // 빛줄기 (새벽·해질녘)
    const L = light(h);
    const rgba = a => `rgba(${L},${a.toFixed(3)})`;

    root.setProperty('--sil', sil.toFixed(3));
    root.setProperty('--rim-solid', L);

    // 1. 림 라이트 + 윤곽 번짐 (의자)
    root.setProperty('--rim-x', `${(sun * (1.2 + 2.6 * back)).toFixed(2)}px`);
    root.setProperty('--rim-y', `${(-0.4 - 1.4 * back).toFixed(2)}px`);
    root.setProperty('--rim-c', rgba(0.08 + 0.84 * back));
    root.setProperty('--rim-glow', `${(3 + 14 * back).toFixed(1)}px`);
    root.setProperty('--rim-glow-c', rgba(0.12 + 0.5 * back));
    root.setProperty('--melt', `${(0.9 * sm(0.5, 0.95, back) * wb).toFixed(2)}px`);

    // 2. 글자 후광
    const a = back * 0.9;
    root.setProperty('--halo', `0 0 2px ${rgba(a)}, 0 0 10px ${rgba(a * 0.75)}, 0 0 26px ${rgba(a * 0.55)}`);

    // 3. 카드 림 라이트 (그림자 대신 가장자리 빛)
    const card = e => {
      const rx = (-sun * (1.5 + 2 * back)).toFixed(2);
      const ry = (1 + 1.5 * back).toFixed(2);
      return `inset ${rx}px ${ry}px 0 0 ${rgba(0.1 + 0.75 * back)}, ` +
             `inset 0 0 ${(10 + 12 * sil).toFixed(0)}px ${rgba(0.05 + 0.3 * sil)}, ` +
             `0 0 ${(e * (1 + 3 * back)).toFixed(0)}px ${rgba(0.06 + 0.5 * back * (0.6 + 0.4 * sil))}`;
    };
    root.setProperty('--shadow-card', card(5));
    root.setProperty('--shadow-card-featured', card(8));

    // 4. 빛 번짐 (블룸): 해 위치에서 퍼지는 radial-gradient, 낮을수록 커짐
    const sx = 50 + sun * 40, sy = 78 - k * 58;
    const r = 34 + 42 * (1 - k) * wb + 10 * (1 - wb);
    const ba = lerp(0.12, 0.12 + 0.36 * back, wb);
    bloom.style.background = `radial-gradient(circle at ${sx.toFixed(1)}% ${sy.toFixed(1)}%, ` +
      `${rgba(ba)} 0%, ${rgba(ba * 0.55)} ${(r * 0.35).toFixed(0)}vmax, ${rgba(0)} ${r.toFixed(0)}vmax)`;

    // 5. 빛줄기: 사선 한 줄기 (새벽·해질녘)
    const ang = 90 + 40 * sun, pos = 50 + sun * 14;
    shaft.style.background = `linear-gradient(${ang.toFixed(0)}deg, ${rgba(0)} ${pos - 24}%, ` +
      `${rgba(0.45 * beam)} ${pos - 5}%, ${rgba(0.75 * beam)} ${pos}%, ${rgba(0.3 * beam)} ${pos + 6}%, ` +
      `${rgba(0)} ${pos + 14}%, ${rgba(0.18 * beam)} ${pos + 24}%, ${rgba(0)} ${pos + 30}%)`;
    const mk = 'linear-gradient(to bottom, #000 0%, rgba(0,0,0,.25) 70%, transparent 100%)';
    shaft.style.webkitMaskImage = mk; shaft.style.maskImage = mk;

    // 의자 모양 투영 그림자 (시각에 따라 길이·방향)
    const lean = Math.max(-55, Math.min(55, Math.atan(X * (len - 0.5) * 0.3) * 180 / Math.PI));
    const blur = lerp(8, 1 + (1 - k) * 6, w);
    root.setProperty('--cast-skew', `${lean.toFixed(1)}deg`);
    root.setProperty('--cast-sy', (-(0.16 + (len - 1) * 0.15)).toFixed(3));
    root.setProperty('--cast-blur', `${(blur * 0.7).toFixed(1)}px`);
    castOp = lerp(0.14, 0.34 + 0.16 * Math.sqrt(k), w);
  }

  // 현재 의자 레이어에서만 투영 그림자가 보이도록
  (function loop() {
    L.forEach((el, i) => {
      const o = Math.max(0, 1 - Math.abs(zd - i) * 1.8);
      el.firstElementChild.style.opacity = (o * castOp).toFixed(3);
    });
    requestAnimationFrame(loop);
  })();

  applyLight();
  setInterval(applyLight, 60000);
  addEventListener('hashchange', applyLight);
})();

draw();
</script>
</body>
</html>
